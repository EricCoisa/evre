name: Deploy Monorepo via Coolify

on:
  push:
    branches:
      - development

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    environment: Evre
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend-next/**'
            backend:
              - 'backend-nest/**'

  deploy-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: Evre
    steps:
      - name: Deploy Frontend
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" "${{ secrets.COOLIFY_FRONTEND_WEBHOOK }}"

  deploy-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: Evre
    steps:
      - name: Deploy Backend
        run: |
          curl -X POST -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" "${{ secrets.COOLIFY_BACKEND_WEBHOOK }}"
