<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notificação</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background:#f6f7fb; margin:0; padding:20px }
      .card { background:#fff; border-radius:8px; padding:24px; max-width:600px; margin:0 auto; box-shadow:0 6px 18px rgba(0,0,0,0.06)}
      .btn { display:inline-block; background:#2563eb; color:#fff; padding:10px 16px; border-radius:6px; text-decoration:none }
      .muted { color:#6b7280 }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Olá {{name}},</h2>
      <h3>{{title}}</h3>
      <p>{{message}}</p>
      {{#if action_url}}
      <p>
        <a class="btn" href="{{action_url}}">Ver detalhes</a>
      </p>
      {{/if}}
      <hr />
      <p class="muted">Você está recebendo este email por configuração de notificação da sua conta.</p>
    </div>
  </body>
</html>
