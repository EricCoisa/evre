<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Código de Verificação</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background:#f6f7fb; margin:0; padding:20px }
      .card { background:#fff; border-radius:8px; padding:24px; max-width:600px; margin:0 auto; box-shadow:0 6px 18px rgba(0,0,0,0.06)}
      .code { display:block; background:#f3f4f6; border-radius:6px; padding:16px; margin:16px 0; text-align:center; font-size:32px; font-weight:bold; letter-spacing:8px; color:#111827 }
      .muted { color:#6b7280 }
      .warning { color:#dc2626; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Olá {{name}},</h2>
      <p class="muted">Use o código abaixo para confirmar esta ação.</p>
      <span class="code">{{code}}</span>
      <p class="warning">Este código expira em 10 minutos e pode ser usado apenas uma vez.</p>
      <hr />
      <p class="muted">Se você não solicitou este código, ignore este e-mail.</p>
    </div>
  </body>
</html>
