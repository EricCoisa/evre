<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recuperação de Senha</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background:#f6f7fb; margin:0; padding:20px }
      .card { background:#fff; border-radius:8px; padding:24px; max-width:600px; margin:0 auto; box-shadow:0 6px 18px rgba(0,0,0,0.06)}
      .btn { display:inline-block; background:#2563eb; color:#fff; padding:10px 16px; border-radius:6px; text-decoration:none }
      .muted { color:#6b7280 }
      .warning { color:#dc2626; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Olá {{name}},</h2>
      <p class="muted">Você solicitou a recuperação de senha em <strong>{{organization}}</strong>.</p>
      <p>{{message}}</p>
      <p>
        <a class="btn" href="{{action_url}}">Redefinir Senha</a>
      </p>
      <p class="warning">Este link expira em 30 minutos e pode ser usado apenas uma vez.</p>
      <hr />
      <p class="muted">Se você não solicitou esta recuperação, ignore este e-mail. Sua senha permanecerá inalterada.</p>
    </div>
  </body>
</html>
