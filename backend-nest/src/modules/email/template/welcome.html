<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Welcome</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; background:#f6f7fb; margin:0; padding:20px }
      .card { background:#fff; border-radius:8px; padding:24px; max-width:600px; margin:0 auto; box-shadow:0 6px 18px rgba(0,0,0,0.06)}
      .btn { display:inline-block; background:#2563eb; color:#fff; padding:10px 16px; border-radius:6px; text-decoration:none }
      .muted { color:#6b7280 }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Welcome to {{organization}} / Bem-vindo ao {{organization}}</h2>
      <p class="muted">Hello {{name}}, your account has been created successfully.</p>
      <p>
        <a class="btn" href="{{action_url}}">Login</a>
      </p>
      <hr />
      <p class="muted">If you did not create this account, please ignore this email.</p>
    </div>
  </body>
</html>
